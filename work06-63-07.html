<!DOCTYPE html>
<html lang="th">
<head>
<title>html link color</title>
<style>
a:link{
        color:green;
        text-decoration:none;
        background-color:purple;
        display:block;
        width:100px;
        padding:7px;
}
a:visited{
        color:white;
        text-decoration:none;
        background-color:transparent;
}
a:hover{
        color:pink;
        text-decoration:none;
        background-color:black;
}
a:active{
        color:blue;
        text-decoration:none;
        background-color:transparent;
}


</style>
</head>
<ul style="list-style-type:none">
<li><a href="">มะม่วง</a></li>
<li><a href="">มะนาว</a></li>
<li><a href="">มะพร้าว</a></li>
<li><a href="">ส้มโอ</a></li>
</ul>

</html>
